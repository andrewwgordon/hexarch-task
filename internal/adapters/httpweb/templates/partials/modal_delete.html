{{ define "partials/modal_delete.html" }}
<h3 class="text-lg font-bold mb-2">Delete task?</h3>
<p class="text-base-content/70 mb-4">This will permanently delete: <span class="font-semibold">{{ .Task.Title }}</span></p>
<div id="modal-delete-error" data-modal-error></div>
<form method="post" action="/app/tasks/{{ .Task.ID }}"
      hx-delete="/app/tasks/{{ .Task.ID }}"
      hx-target="#modal-delete-error"
      hx-swap="innerHTML"
      hx-status:2xx="swap:none"
      hx-disable="find button[type=submit]">
  <input type="hidden" name="csrf_token" value="{{ .CSRF }}" />
  <div class="modal-action">
    <button type="button" class="btn btn-ghost" data-close>Cancel</button>
    <button type="submit" class="btn btn-error">Delete</button>
  </div>
</form>
{{ end }}
