{{ define "partials/modal_user_create.html" }}
<h3 class="text-lg font-bold mb-4">New user</h3>
<div id="modal-user-create-error"></div>
<form method="post" action="/app/users"
      hx-post="/app/users"
      hx-target="this"
      hx-swap="none"
      hx-on::after:request="if(event.detail.ctx.response.status < 400) this.closest('dialog').close()">
  <input type="hidden" name="csrf_token" value="{{ .CSRF }}" />

  <div class="flex flex-col gap-3">
    <label class="form-control">
      <span class="label-text mb-1">Email</span>
      <input type="email" name="email" placeholder="user@example.com"
             class="input input-bordered w-full" required />
    </label>

    <label class="form-control">
      <span class="label-text mb-1">Password</span>
      <input type="password" name="password" placeholder="initial password"
             class="input input-bordered w-full" required minlength="1" />
    </label>

    <label class="label cursor-pointer justify-start gap-3">
      <input type="checkbox" name="isadmin" class="toggle toggle-primary" />
      <span class="label-text">Administrator</span>
    </label>
  </div>

  <div class="modal-action">
    <button type="button" class="btn btn-ghost" onclick="document.getElementById('modal-user-create').close()">Cancel</button>
    <button type="submit" class="btn btn-primary">Create</button>
  </div>
</form>
{{ end }}
