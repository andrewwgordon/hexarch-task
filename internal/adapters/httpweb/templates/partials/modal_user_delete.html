{{ define "partials/modal_user_delete.html" }}
<h3 class="text-lg font-bold mb-2">Delete user?</h3>
<p class="text-base-content/70 mb-4">
  This will permanently delete: <span class="font-semibold">{{ .User.Email }}</span><br />
  <span class="text-sm">All tasks owned by this user will also be deleted.</span>
  {{ if eq .User.ID $.CurrentID }}
  <span class="block mt-2 text-error">You cannot delete your own account.</span>
  {{ end }}
</p>
<div id="modal-user-delete-error" data-modal-error></div>
<form method="post" action="/app/users/{{ .User.ID }}"
      hx-delete="/app/users/{{ .User.ID }}"
      hx-target="#modal-user-delete-error"
      hx-swap="innerHTML"
      hx-status:2xx="swap:none"
      hx-disable="find button[type=submit]">
  <input type="hidden" name="csrf_token" value="{{ .CSRF }}" />
  <div class="modal-action">
    <button type="button" class="btn btn-ghost" data-close>Cancel</button>
    {{ if ne .User.ID $.CurrentID }}
    <button type="submit" class="btn btn-error">Delete</button>
    {{ end }}
  </div>
</form>
{{ end }}
