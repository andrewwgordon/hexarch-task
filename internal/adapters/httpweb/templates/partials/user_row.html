{{ define "partials/user_row.html" }}
{{ $cur := .CurrentID }}
{{ range .Users }}
<tr id="user-row-{{ .ID }}">
  <td>
    <div class="font-medium">{{ .Email }}</div>
  </td>
  <td>
    {{ if .IsAdmin }}
      <span class="badge badge-primary badge-sm">admin</span>
    {{ else }}
      <span class="badge badge-ghost badge-sm">user</span>
    {{ end }}
  </td>
  <td class="font-mono text-xs text-base-content/60">{{ .ID }}</td>
  <td class="text-right">
    <div class="flex items-center gap-1 justify-end">
      <button class="btn btn-xs btn-ghost"
              hx-get="/app/users/{{ .ID }}/edit"
              hx-target="#user-edit-modal-box"
              hx-swap="innerHTML"
              aria-label="Edit user" title="Edit">✏️</button>

      {{ if ne .ID $cur }}
      <button class="btn btn-xs btn-error btn-outline"
              hx-get="/app/users/{{ .ID }}/delete"
              hx-target="#user-delete-modal-box"
              hx-swap="innerHTML"
              aria-label="Delete user" title="Delete">🗑️</button>
      {{ end }}
    </div>
  </td>
</tr>
{{ end }}
{{ end }}
