<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do</title>

  <!-- 1. DaisyUI v5 Stylesheet -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <!-- 2. Tailwind CSS v4 Browser Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- 3. HTMX v4.0.0 -->
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0"
          integrity="sha384-BvJpBiO8Kh31EqtJe5DRIeWrHWnCGkwytKs9NKFi86Hhw96dEqdEMzZDeK9iEGTc"
          crossorigin="anonymous"></script>
</head>
<body class="bg-base-200 min-h-screen text-base-content">
  <div class="max-w-5xl mx-auto p-4">

    <!-- Navbar -->
    <div class="navbar bg-base-100 rounded-box shadow px-4 mb-4">
      <div class="navbar-start">
        <a class="text-lg font-bold text-primary" href="/app/">To Do</a>
      </div>
      <div class="navbar-end">
        <!-- Light / Dark theme toggle -->
        <label class="btn btn-sm btn-ghost btn-circle swap swap-rotate" aria-label="Toggle theme" title="Toggle theme">
          <input id="theme-toggle" type="checkbox" class="theme-controller" value="dark" />
          <!-- sun icon (light theme) -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="swap-off w-4 h-4">
            <path d="M8 1C8.41421 1 8.75 1.33579 8.75 1.75V3.25C8.75 3.66421 8.41421 4 8 4C7.58579 4 7.25 3.66421 7.25 3.25V1.75C7.25 1.33579 7.58579 1 8 1Z"/>
            <path d="M10.5 8C10.5 9.38071 9.38071 10.5 8 10.5C6.61929 10.5 5.5 9.38071 5.5 8C5.5 6.61929 6.61929 5.5 8 5.5C9.38071 5.5 10.5 6.61929 10.5 8Z"/>
            <path d="M12.9498 4.11089C13.2427 3.81799 13.2427 3.34312 12.9498 3.05023C12.6569 2.75733 12.182 2.75733 11.8891 3.05023L10.8284 4.11089C10.5356 4.40378 10.5356 4.87865 10.8284 5.17155C11.1213 5.46444 11.5962 5.46444 11.8891 5.17155L12.9498 4.11089Z"/>
            <path d="M15 8C15 8.41421 14.6642 8.75 14.25 8.75H12.75C12.3358 8.75 12 8.41421 12 8C12 7.58579 12.3358 7.25 12.75 7.25H14.25C14.6642 7.25 15 7.58579 15 8Z"/>
            <path d="M11.8891 12.9498C12.182 13.2427 12.6569 13.2427 12.9498 12.9498C13.2427 12.6569 13.2427 12.182 12.9498 11.8891L11.8891 10.8284C11.5962 10.5356 11.1213 10.5356 10.8285 10.8284C10.5356 11.1213 10.5356 11.5962 10.8285 11.8891L11.8891 12.9498Z"/>
            <path d="M8 12C8.41421 12 8.75 12.3358 8.75 12.75V14.25C8.75 14.6642 8.41421 15 8 15C7.58579 15 7.25 14.6642 7.25 14.25V12.75C7.25 12.3358 7.58579 12 8 12Z"/>
            <path d="M5.17157 11.8891C5.46446 11.5962 5.46446 11.1213 5.17157 10.8284C4.87867 10.5355 4.4038 10.5355 4.11091 10.8284L3.05025 11.8891C2.75735 12.182 2.75735 12.6569 3.05025 12.9497C3.34314 13.2426 3.81801 13.2426 4.11091 12.9497L5.17157 11.8891Z"/>
            <path d="M4 8C4 8.41421 3.66421 8.75 3.25 8.75H1.75C1.33579 8.75 1 8.41421 1 8C1 7.58579 1.33579 7.25 1.75 7.25H3.25C3.66421 7.25 4 7.58579 4 8Z"/>
            <path d="M4.11091 5.17157C4.40381 5.46446 4.87868 5.46446 5.17157 5.17157C5.46447 4.87867 5.46447 4.4038 5.17157 4.11091L4.11091 3.05025C3.81802 2.75735 3.34315 2.75735 3.05025 3.05024C2.75736 3.34314 2.75736 3.81801 3.05025 4.11091L4.11091 5.17157Z"/>
          </svg>
          <!-- moon icon (dark theme) -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="swap-on w-4 h-4">
            <path d="M14.438 10.1477C14.6278 9.72286 14.1166 9.36124 13.6899 9.54667C13.0188 9.83824 12.2783 9.9999 11.5 9.9999C8.46243 9.9999 6 7.53747 6 4.4999C6 3.72165 6.16164 2.98114 6.45319 2.31014C6.63861 1.88337 6.27698 1.37223 5.85212 1.56197C3.58205 2.57578 2 4.85312 2 7.49997C2 11.0898 4.91015 14 8.5 14C11.1469 14 13.4243 12.4179 14.438 10.1477Z"/>
          </svg>
        </label>
        <button type="button" class="btn btn-primary" onclick="modal_create.showModal()">+ New Task</button>
      </div>
    </div>

    <!-- Stats -->
    <div id="stats" class="mb-4">
      {{ template "partials/stats.html" . }}
    </div>

    <!-- Toolbar / filters -->
    <div class="card bg-base-100 shadow mb-4 p-3">
      <form id="filter-form" class="flex flex-wrap gap-2 items-center">
        <label class="input input-sm flex-1 min-w-[160px] items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
               class="w-4 h-4 opacity-70"><path fill-rule="evenodd" d="M9.965 11.026a5 5 0 1 1 1.06-1.06l3.5 3.5a.75.75 0 1 1-1.06 1.06l-3.5-3.5ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z" clip-rule="evenodd" /></svg>
          <input type="search" name="search" placeholder="Search tasks..."
                 value="{{ .List.Search }}"
                 class="grow"
                 hx-get="/app/tasks"
                 hx-trigger="input changed delay:300ms"
                 hx-target="#task-list"
                 hx-swap="innerHTML"
                 hx-include="#filter-form"
                 hx-push-url="true"
                 hx-indicator="#list-loading" />
        </label>

        <select name="status" class="select select-sm"
                hx-get="/app/tasks"
                hx-trigger="change"
                hx-target="#task-list"
                hx-swap="innerHTML"
                hx-include="#filter-form"
                hx-push-url="true"
                hx-indicator="#list-loading">
          <option value="" {{ if eq .List.StatusFilter "" }}selected{{ end }}>All</option>
          <option value="todo" {{ if eq .List.StatusFilter "todo" }}selected{{ end }}>To do</option>
          <option value="in_progress" {{ if eq .List.StatusFilter "in_progress" }}selected{{ end }}>In progress</option>
          <option value="done" {{ if eq .List.StatusFilter "done" }}selected{{ end }}>Done</option>
          <option value="archived" {{ if eq .List.StatusFilter "archived" }}selected{{ end }}>Archived</option>
        </select>

        <a href="/app/" class="btn btn-sm btn-ghost btn-circle" aria-label="Clear filters" title="Clear filters">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4">
            <path fill-rule="evenodd" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm.75 7.25 2.13-2.13a.75.75 0 1 0-1.06-1.06L8 7.94 6.13 6.13a.75.75 0 0 0-1.06 1.06l1.81 1.81-1.81 1.81a.75.75 0 1 0 1.06 1.06L8 9.06l1.81 1.81a.75.75 0 1 0 1.06-1.06L8.75 8.25Z" clip-rule="evenodd" />
          </svg>
        </a>

        <span class="text-sm text-base-content/60 whitespace-nowrap" id="list-count">{{ .List.FilteredCount }} tasks</span>
        <span id="list-loading" class="loading loading-spinner loading-sm htmx-indicator"></span>
      </form>
    </div>

    <!-- Task list region -->
    <div id="task-list">
      {{ template "partials/task_list.html" . }}
    </div>

  </div>

  <!-- Create dialog -->
  <dialog id="modal_create" class="modal">
    <div class="modal-box">
      {{ template "partials/modal_create.html" . }}
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <!-- Edit dialog (server-prefilled) -->
  <dialog id="modal-edit" class="modal">
    <div class="modal-box" id="edit-modal-box">
      {{ template "partials/modal_edit.html" . }}
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <!-- Delete dialog (server-prefilled) -->
  <dialog id="modal-delete" class="modal">
    <div class="modal-box" id="delete-modal-box">
      {{ template "partials/modal_delete.html" . }}
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <!-- Toast region -->
  <div class="toast toast-end" id="toast"></div>

  <!-- Theme persistence: use stored choice, otherwise follow system preference -->
  <script>
    (function () {
      var KEY = "daisyui-theme";
      var input = document.getElementById("theme-toggle");
      if (!input) return;
      var stored = null;
      try { stored = localStorage.getItem(KEY); } catch (e) {}
      var dark;
      if (stored === null) {
        dark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      } else {
        dark = stored === "dark";
      }
      input.checked = dark;
      input.addEventListener("change", function () {
        try { localStorage.setItem(KEY, input.checked ? "dark" : "light"); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
