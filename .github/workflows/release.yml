name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  APP_NAME: hexarch

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run full test suite
        run: go test -race ./...

  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 (64-bit x86)
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          # arm64 Linux (e.g. Raspberry Pi 5, AWS Graviton)
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          ext=""
          [ "${GOOS}" = "windows" ] && ext=".exe"
          out="${APP_NAME}-${version}-${GOOS}-${GOARCH}${ext}"
          echo "Building ${out}"
          go build -trimpath -ldflags "-s -w" \
            -o "dist/${out}" ./cmd/main.go

      - name: Smoke test (linux/amd64, in-memory backend)
        shell: bash
        # Cross-compiled darwin/arm64 etc. binaries cannot be launched on the
        # ubuntu-latest runner, so only the native linux/amd64 build is
        # executed. Every CLI subcommand authenticates first (FR-A1): the
        # memory backend auto-seeds the bootstrap admin (docs/auth.md §3.6),
        # and we log in as that account via HEXARCH_EMAIL / HEXARCH_PASSWORD.
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          HEXARCH_DB_TYPE: memory
          HEXARCH_EMAIL: admin@email.com
          HEXARCH_PASSWORD: admin
        run: |
          version="${GITHUB_REF_NAME}"
          bin="dist/${APP_NAME}-${version}-linux-amd64"
          "${bin}" cli whoami
          "${bin}" cli list

      - name: Package (tar.gz / zip)
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME}"
          ext=""
          [ "${GOOS}" = "windows" ] && ext=".exe"
          name="${APP_NAME}-${version}-${GOOS}-${GOARCH}"
          cp README.md LICENSE dist/
          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -q "${name}.zip" "${name}${ext}" README.md LICENSE)
          else
            (cd dist && tar czf "${name}.tar.gz" "${name}${ext}" README.md LICENSE)
          fi
          rm "dist/${name}${ext}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create GitHub release with archives
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          make_latest: true
