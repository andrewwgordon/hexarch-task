name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Go module name, used to name build artifacts and coverage files.
  APP_NAME: hexarch

jobs:
  lint:
    name: Lint & vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Resolves the version from the `go` directive in go.mod (1.27.x).
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Optional deeper static analysis. Enable once staticcheck / golangci-lint
      # publishes a release that fully supports the Go version in go.mod.
      # - name: golangci-lint
      #   uses: golangci/golangci-lint-action@v6
      #   with:
      #     args: --timeout=5m

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Unit, adapter & integration tests (race detector, coverage)
        # The sqlite backend uses modernc.org/sqlite (pure Go, no CGO), so the
        # race detector and coverage both work without a C toolchain. The
        # integration test boots its own SQLite-backed server, so no external
        # services are needed.
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  coverage-report:
    name: Coverage summary
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage

      - name: Report total coverage
        shell: bash
        run: |
          # Merge per-OS profiles, keeping one entry per (mode:block) line.
          cat coverage/coverage-*.out | awk '!seen[$0]++' > merged.out
          total=$(go tool cover -func=merged.out | tail -1 | awk '{print $3}')
          echo "Total coverage: $total" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=merged.out >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        run: |
          # Windows binaries need the .exe suffix to be directly executable.
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          go build -v -o "hexarch${ext}" ./cmd/main.go

      - name: Smoke test (in-memory backend)
        shell: bash
        # 'cli list' on an empty in-memory repository proves the binary wires
        # up the full hexagon (repo factory -> service -> adapter) end-to-end.
        run: |
          bin="./hexarch"
          [ "$RUNNER_OS" = "Windows" ] && bin="./hexarch.exe"
          "${bin}" cli list
        env:
          HEXARCH_DB_TYPE: memory
